[project]
name = "muesli"
version = "0.2.0"
description = "Granola-style meeting transcriber for Linux: PipeWire capture, cloud or local Whisper, Waybar integration, meeting detection. Terminal only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "httpx>=0.27"]
classifiers = ["Environment :: Console", "Operating System :: POSIX :: Linux"]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]

[project.scripts]
muesli = "muesli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muesli"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E702", "B905"]
