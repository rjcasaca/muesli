name: ci
on: [push, pull_request]
jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv venv && uv pip install ruff .
      - run: .venv/bin/ruff check muesli
      - run: .venv/bin/python -c "import muesli.cli, muesli.daemon, muesli.tui, muesli.stt, muesli.detect"
      - run: .venv/bin/muesli --version
